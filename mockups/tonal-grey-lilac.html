<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grey-lilac: where it applies</title>
<style>body{margin:0;padding:16px;background:#E3E0DB;font-family:Figtree,system-ui,sans-serif;color:#121212}

<section class="card"><h2>2. Capsule page footer: Edit capsule (icon)</h2><div class="bar"><button class="b t ic">✎</button><span class="sp"></span><button class="b dark">Add pieces</button></div></section>

<p style="font-size:13px;color:#6E6E6E;max-width:420px">Unchanged: black main buttons, purple Shuffle, and selected chips (still stone grey).</p>
