<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greyish button options</title>
<style>body{margin:0;padding:16px;background:#E3E0DB;font-family:Figtree,system-ui,sans-serif;color:#121212}
h1{font-size:18px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:#F7F5F1;border-radius:16px;padding:14px}h2{font-size:14px;margin:0 0 10px}code{font-weight:400;color:#6E6E6E;margin-left:6px}
.photo{display:flex;gap:8px;height:120px;margin-bottom:12px}.photo img{flex:1;min-width:0;object-fit:contain}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.b{font:600 13px Figtree,system-ui,sans-serif;padding:0 16px;min-height:44px;border-radius:999px;border:0;box-shadow:0 1px 2px rgba(18,18,18,.07),0 2px 7px rgba(18,18,18,.07);cursor:pointer}
.dark{background:#121212;color:#E3E0DB}.chip{font:600 12px Figtree,system-ui,sans-serif;background:#D5D2CC;padding:13px 16px;border-radius:999px}</style></head><body>
<h1>Greyish options (black = main button)</h1><div class="grid"><section class="card"><h2>Current (stone, = selected-chip grey) <code>#D5D2CC</code></h2>
<div class="photo"><img src="../wardrobe-photos/afends-marina-seersucker-top-flat-nobg.webp" alt=""><img src="../wardrobe-photos/agolde-white-jeans-nobg.webp" alt=""></div>
<div class="row"><button class="b" style="background:#D5D2CC;color:#121212" onmouseover="this.style.background='#CAC7C0'" onmouseout="this.style.background='#D5D2CC'">+ Add accessories</button>
<button class="b dark">Save</button><span class="chip">Selected chip</span></div></section><section class="card"><h2>Lilac wash <code>#DAD4E6</code></h2>
<div class="photo"><img src="../wardrobe-photos/afends-marina-seersucker-top-flat-nobg.webp" alt=""><img src="../wardrobe-photos/agolde-white-jeans-nobg.webp" alt=""></div>
<div class="row"><button class="b" style="background:#DAD4E6;color:#3F3558" onmouseover="this.style.background='#CDC5DC'" onmouseout="this.style.background='#DAD4E6'">+ Add accessories</button>
<button class="b dark">Save</button><span class="chip">Selected chip</span></div></section><section class="card"><h2>Grey-lilac <code>#D6D1DA</code></h2>
<div class="photo"><img src="../wardrobe-photos/afends-marina-seersucker-top-flat-nobg.webp" alt=""><img src="../wardrobe-photos/agolde-white-jeans-nobg.webp" alt=""></div>
<div class="row"><button class="b" style="background:#D6D1DA;color:#2E2A36" onmouseover="this.style.background='#CBC5D0'" onmouseout="this.style.background='#D6D1DA'">+ Add accessories</button>
<button class="b dark">Save</button><span class="chip">Selected chip</span></div></section><section class="card"><h2>Cool grey <code>#D2D5D8</code></h2>
<div class="photo"><img src="../wardrobe-photos/afends-marina-seersucker-top-flat-nobg.webp" alt=""><img src="../wardrobe-photos/agolde-white-jeans-nobg.webp" alt=""></div>
<div class="row"><button class="b" style="background:#D2D5D8;color:#1F262B" onmouseover="this.style.background='#C5C9CD'" onmouseout="this.style.background='#D2D5D8'">+ Add accessories</button>
<button class="b dark">Save</button><span class="chip">Selected chip</span></div></section><section class="card"><h2>Warm taupe <code>#DDD3CA</code></h2>
<div class="photo"><img src="../wardrobe-photos/afends-marina-seersucker-top-flat-nobg.webp" alt=""><img src="../wardrobe-photos/agolde-white-jeans-nobg.webp" alt=""></div>
<div class="row"><button class="b" style="background:#DDD3CA;color:#3A2F26" onmouseover="this.style.background='#D0C5BA'" onmouseout="this.style.background='#DDD3CA'">+ Add accessories</button>
<button class="b dark">Save</button><span class="chip">Selected chip</span></div></section><section class="card"><h2>Light stone (lifted) <code>#EDEAE5</code></h2>
<div class="photo"><img src="../wardrobe-photos/afends-marina-seersucker-top-flat-nobg.webp" alt=""><img src="../wardrobe-photos/agolde-white-jeans-nobg.webp" alt=""></div>
<div class="row"><button class="b" style="background:#EDEAE5;color:#121212" onmouseover="this.style.background='#E2DED8'" onmouseout="this.style.background='#EDEAE5'">+ Add accessories</button>
<button class="b dark">Save</button><span class="chip">Selected chip</span></div></section></div></body></html>
