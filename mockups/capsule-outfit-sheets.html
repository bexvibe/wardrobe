<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capsule and Sheet Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F6;--fg:#171717;--muted:#66666A;--panel:#FFFFFF;--rule:#E2E2E0;--stage:#E9E9E7;
  --brand:#756694;--brand-ink:#FFFFFF;--good:#2F6B4A;--warn:#8A5A12;
  --display:'Fraunces',Georgia,serif;--body:'Work Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121213;--fg:#EDEDEB;--muted:#9A9AA0;--panel:#1B1B1D;--rule:#2C2C2F;--stage:#232326;--brand:#9A8CBB;--brand-ink:#17141F;--good:#7FC29A;--warn:#D9A74F;color-scheme:dark;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;padding:32px 16px 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:-.015em;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1}
h2{font-size:22px}
p{margin:0}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.intro{display:grid;gap:12px;max-width:62ch;margin-bottom:24px}
.intro p{color:var(--muted)}
.parts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.part{appearance:none;font:inherit;font-weight:600;cursor:pointer;padding:10px 18px;border-radius:999px;border:1px solid var(--rule);background:var(--panel);color:var(--fg)}
.part[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.picker{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
.opt{appearance:none;font:inherit;text-align:left;cursor:pointer;padding:9px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);display:grid;gap:1px;min-width:140px}
.opt .t{font-weight:600;font-size:14px}.opt .s{font-size:12px;color:var(--muted)}
.opt[aria-pressed=true]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.opt:focus-visible,.part:focus-visible,.pick:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:1fr;gap:24px}}
.stagebox{background:var(--stage);border-radius:20px;padding:22px 0;display:grid;justify-items:center;gap:12px}
.hint{font-size:13px;color:var(--muted);max-width:300px;text-align:center;padding:0 8px}
.side{display:grid;gap:18px}
.side h2{margin-bottom:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:520px){.cols{grid-template-columns:1fr}}
.col{border-top:2px solid var(--rule);padding-top:10px}
.col.good{border-color:var(--good)}.col.warn{border-color:var(--warn)}
.col b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.col.good b{color:var(--good)}.col.warn b{color:var(--warn)}
.col ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pick,.reset{appearance:none;font:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:8px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);color:var(--fg)}
.pick.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.summary{margin-top:28px;padding:16px 18px;border:1px solid var(--rule);border-radius:14px;background:var(--panel);display:grid;gap:4px}
.summary code{font-family:var(--mono);font-size:13px}

/* ---- the phone: the app's own light UI, always light ---- */
.phone{position:relative;width:340px;height:690px;border-radius:38px;border:8px solid #1b1b1d;background:#fff;overflow:hidden;color:#171717;font-family:var(--body);font-size:14px}
.phone *{box-sizing:border-box}
.app{height:100%;display:flex;flex-direction:column}
.apphead{padding:20px 16px 8px;font-family:var(--display);font-size:22px}
.seg{display:flex;margin:0 16px 10px;background:#EFEDF3;border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font:600 13px var(--body);cursor:pointer;color:#555}
.seg button.on{background:#fff;color:#171717;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.list{flex:1;overflow:auto;padding:0 16px 16px;display:grid;gap:10px;align-content:start}
.card{border:1px solid #E6E3EC;border-radius:14px;padding:10px;background:#fff;cursor:pointer;position:relative}
.card .cname{font-weight:600;margin-top:8px;display:flex;justify-content:space-between;align-items:baseline}
.card .cname small{font-weight:400;color:#777;font-size:12px}
.thumbs{display:flex;gap:6px}
.thumbs img{width:0;flex:1;aspect-ratio:1;object-fit:contain;background:#F6F5F8;border-radius:8px}
.cdesc{font-size:12px;color:#777}
.panel{margin-top:10px;border-top:1px solid #EEE;padding-top:10px;cursor:default}
.pchips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.pchip{flex:0 0 74px;text-align:center;font-size:11px;line-height:1.2;cursor:pointer}
.pchip img{width:74px;height:74px;object-fit:contain;background:#F6F5F8;border-radius:10px;display:block;margin-bottom:3px}
.pchip.sel img{outline:2px solid #756694}
.prow{display:flex;gap:8px;margin-top:10px;align-items:center}
.btn{appearance:none;font:600 13px var(--body);padding:9px 12px;border-radius:10px;border:1px solid #D6D2DE;background:#fff;color:#171717;cursor:pointer}
.btn.pri{background:#756694;border-color:#756694;color:#fff}
.btn.grow{flex:1}
.menuwrap{position:relative;margin-left:auto}
.menu{position:absolute;right:0;bottom:40px;background:#fff;border:1px solid #DDD;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;z-index:3;min-width:160px}
.menu div{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px}.menu div:hover{background:#F3F1F7}
.menu div.dng{color:#B3261E}
.banner{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.lenschip{display:inline-flex;align-items:center;gap:8px;background:#756694;color:#fff;border-radius:999px;padding:6px 8px 6px 14px;font-weight:600;font-size:13px;cursor:pointer}
.lenschip span{background:rgba(255,255,255,.25);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 div{cursor:pointer;font-size:11px;line-height:1.2}
.grid3 img{width:100%;aspect-ratio:1;object-fit:contain;background:#F6F5F8;border-radius:10px;display:block;margin-bottom:3px}
.miniseg{display:flex;gap:6px;margin-bottom:10px}
.miniseg button{font:600 12px var(--body);border:1px solid #D6D2DE;background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
.miniseg button.on{background:#171717;color:#fff;border-color:#171717}
.toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,20px);background:#222;color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;opacity:0;transition:.25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.layer{position:absolute;inset:0;pointer-events:none;z-index:6}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;pointer-events:auto;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1),height .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.sheet.in{transform:translateY(0) scale(calc(1 - var(--d,0)*.045));transform-origin:50% 100%}
.sheet::after{content:'';position:absolute;inset:0;background:#000;opacity:calc(var(--d,0)*.16);pointer-events:none;border-radius:inherit}
.grip{height:22px;flex:0 0 22px;display:grid;place-items:center;cursor:pointer}
.grip::before{content:'';width:38px;height:4px;border-radius:4px;background:#CFCBD8}
.pgwrap{position:relative;flex:1;min-height:0;overflow:hidden}
.pg,.pgin{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.pgin{position:relative;flex:1;min-height:0}
.pg.from-fwd{animation:inR .3s both}.pg.from-back{animation:inL .3s both}
.pg.to-fwd{animation:outL .3s both;pointer-events:none}.pg.to-back{animation:outR .3s both;pointer-events:none}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes inL{from{transform:translateX(-30%);opacity:.4}to{transform:none;opacity:1}}
@keyframes outL{to{transform:translateX(-30%);opacity:.4}}
@keyframes outR{to{transform:translateX(100%)}}
.sh-head{display:grid;grid-template-columns:84px 1fr 84px;align-items:center;padding:0 10px 6px;min-height:34px}
.sh-head .tt{text-align:center;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .r{text-align:right}
.hb{border:0;background:none;font:600 13px var(--body);color:#756694;cursor:pointer;padding:6px 4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs{display:flex;gap:2px;padding:0 14px 8px;font-size:12px;color:#888;flex-wrap:wrap}
.crumbs button{border:0;background:none;font:500 12px var(--body);color:#756694;cursor:pointer;padding:2px 3px}
.crumbs button.cur{color:#171717;font-weight:600;cursor:default}
.allbar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px;font-size:12px;color:#777}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:#D8D4E0}.dots i.on{background:#756694}
.body{flex:1;overflow:auto;padding:4px 16px 16px;min-height:0}
.foot{flex:0 0 auto;display:flex;gap:8px;padding:10px 16px 16px;border-top:1px solid #EEE;background:#fff}
.hero{display:grid;gap:8px;grid-template-columns:repeat(3,1fr);margin-bottom:12px}
.hero.c2{grid-template-columns:repeat(2,1fr)}
.hero img{width:100%;aspect-ratio:1;object-fit:contain;background:#F6F5F8;border-radius:12px}
.body h3{font-family:var(--display);font-size:21px;margin:0}
.sub{color:#777;font-size:13px;margin-bottom:10px}
.lbl{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#888;margin:14px 0 6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #F0EEF4;cursor:pointer}
.row img{width:46px;height:46px;object-fit:contain;background:#F6F5F8;border-radius:8px;flex:0 0 46px}
.row div{flex:1;min-width:0}.row b{display:block;font-weight:600;font-size:14px}.row span{font-size:12px;color:#777}
.row i{font-style:normal;color:#A9A4B5;font-size:18px}
.row .minith{display:flex;gap:3px;flex:0 0 auto}.row .minith img{width:30px;height:30px;flex:none}
.photo{display:grid;place-items:center;background:#F6F5F8;border-radius:14px;height:150px;margin-bottom:10px}.photo img{height:130px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #D6D2DE;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;background:#fff}
.chip.on{background:#756694;border-color:#756694;color:#fff}
.chip.add{border-style:dashed;color:#756694}
.inl{display:flex;gap:6px;margin-top:8px}
.inl input,.field{flex:1;font:inherit;padding:9px 12px;border:1px solid #CFCBD8;border-radius:10px;width:100%}
.check{width:20px;height:20px;border-radius:6px;border:2px solid #BDB8C8;display:grid;place-items:center;font-size:12px;color:#fff;flex:0 0 20px}
.check.on{background:#756694;border-color:#756694}
.track{display:flex;flex:1;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:4px 16px 16px}
.arrow{border:1px solid #D6D2DE;background:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1}
.ctr{font:500 12px var(--mono);color:#777}
</style>
</head>
<body>
<div class="wrap">
  <div class="intro">
    <span class="kicker">Wardrobe · design options</span>
    <h1>Opening capsules and outfits, and stopping sheets stacking up</h1>
    <p>Two questions, each with live options. Use the phone: tap cards, pieces and buttons. Mark the option you prefer with <b>Pick this</b>; your picks collect at the bottom.</p>
  </div>

  <div class="parts" role="tablist">
    <button class="part" id="part-open" aria-pressed="true" onclick="setPart('open')">1 · How a capsule or outfit opens</button>
    <button class="part" id="part-stack" aria-pressed="false" onclick="setPart('stack')">2 · Sheet over sheet</button>
  </div>

  <div class="picker" id="picker"></div>

  <div class="stage">
    <div class="stagebox">
      <div class="phone" id="phone">
        <div class="app">
          <div class="apphead">Wardrobe</div>
          <div class="seg" id="seg">
            <button data-act="tab" data-id="outfits" class="on">Outfits</button>
            <button data-act="tab" data-id="capsules">Capsules</button>
          </div>
          <div class="list" id="list"></div>
        </div>
        <div class="scrim" id="scrim" data-act="scrim"></div>
        <div class="layer" id="layer"></div>
        <div class="toast" id="toast"></div>
      </div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="side" id="side"></div>
  </div>

  <div class="summary" id="summary"></div>
</div>

let part='open',openOpt='A',stackOpt='today',addon=false,tab='outfits';

function resetData(){O=JSON.parse(JSON.stringify(O0));C=JSON.parse(JSON.stringify(C0));}
function resetAll(){
  resetData();stack=[];expanded=null;lens=null;menuFor=null;selChip=null;inlineNew=false;tab='outfits';
  $('#layer').innerHTML='';sh=null;els=[];$('#scrim').classList.remove('on');
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.id===tab));
  renderList();
}
function setPart(p){part=p;
  $('#part-open').setAttribute('aria-pressed',p==='open');$('#part-stack').setAttribute('aria-pressed',p==='stack');
  renderPicker();resetAll();renderSide();}
function setOpt(k){if(part==='open')openOpt=k;else stackOpt=k;renderPicker();resetAll();renderSide();}
function renderPicker(){
  const set=part==='open'?OPEN:STACK,cur=part==='open'?openOpt:stackOpt;
  $('#picker').innerHTML=Object.entries(set).map(([k,o])=>`<button class="opt" aria-pressed="${k===cur}" onclick="setOpt('${k}')"><span class="t">${o.t}</span><span class="s">${o.s}</span></button>`).join('');
}
function renderSide(){
  const set=part==='open'?OPEN:STACK,k=part==='open'?openOpt:stackOpt,o=set[k];
  $('#hint').textContent=o.hint;
  $('#side').innerHTML=`
    <div><span class="kicker">${part==='open'?'Question 1':'Question 2'}</span><h2>${o.t}</h2></div>
    <p>${o.what}</p>
    <div class="cols">
      <div class="col good"><b>Good</b><ul>${o.good.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="col warn"><b>Costs</b><ul>${o.warn.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </div>
    <div class="tools">
      <button class="pick ${picks[part]===k?'on':''}" onclick="pickThis()">${picks[part]===k?'★ Picked':'☆ Pick this'}</button>
      <button class="reset" onclick="resetAll()">Reset phone</button>
      ${part==='stack'?`<label class="toggle"><input type="checkbox" ${addon?'checked':''} onchange="addon=this.checked;refresh()"> Add “step n of m” and Close all (works with any option)</label>`:''}
    </div>`;
  renderSummary();
}
function pickThis(){const k=part==='open'?openOpt:stackOpt;picks[part]=picks[part]===k?null:k;renderSide();}
function renderSummary(){
  const a=picks.open?OPEN[picks.open].t:'not chosen yet',b=picks.stack?STACK[picks.stack].t:'not chosen yet';
  $('#summary').innerHTML=`<span class="kicker">Your picks</span><div>Opening: <code>${a}</code></div><div>Sheet over sheet: <code>${b}</code>${addon?' <code>+ Close all</code>':''}</div>`;
}

/* ---------- list ---------- */
const get=(kind,id)=>(kind==='outfit'?O:C).find(x=>x.id===id);
const outfitsIn=c=>O.filter(o=>o.items.every(i=>c.items.includes(i)));
const capsulesOf=p=>C.filter(c=>c.items.includes(p));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1500);}
function cardHtml(kind,it){
  const exp=part==='open'&&openOpt==='B'&&expanded===it.id;
  const th=`<div class="thumbs">${it.items.slice(0,4).map(img).join('')}</div>`;
  const head=kind==='outfit'
    ?`<div class="cname">${it.name}<small>${it.items.length} pieces</small></div>`
    :`<div class="cname">${it.name}<small>${it.items.length} pieces</small></div><div class="cdesc">${it.desc||''}</div>`;
  let panel='';
  if(exp){
    panel=`<div class="panel" data-act="noop">
      <div class="pchips">${it.items.map(k=>`<div class="pchip ${selChip===k?'sel':''}" data-act="chip" data-id="${k}">${img(k)}${PC[k][0]}</div>`).join('')}</div>
      <div class="prow">
        <button class="btn pri" data-act="toast" data-id="${kind==='outfit'?'Saved to faves':'Added pieces'}">${kind==='outfit'?'♡ Save':'+ Add pieces'}</button>
        <div class="menuwrap"><button class="btn" data-act="menu" data-id="${it.id}">⋯</button>
          ${menuFor===it.id?`<div class="menu"><div data-act="toast" data-id="${kind==='outfit'?'Accessories':'Edit capsule'}">${kind==='outfit'?'Add accessories':'Edit capsule'}</div><div data-act="toast" data-id="Shared">Share</div><div class="dng" data-act="toast" data-id="Deleted">Delete</div></div>`:''}
        </div>
      </div></div>`;
  }
  return `<div class="card" data-act="card" data-kind="${kind}" data-id="${it.id}">${th}${head}${panel}</div>`;
}
function renderList(){
  const L=$('#list'),kind=tab==='outfits'?'outfit':'capsule';
  $('#seg').style.display=lens?'none':'';
  if(lens){
    const c=get('capsule',lens);
    const outs=outfitsIn(c);
    L.innerHTML=`<div class="banner"><span class="lenschip" data-act="lensoff">Capsule: ${c.name} <span>✕</span></span></div>
      <div class="miniseg"><button class="${lensTab==='pieces'?'on':''}" data-act="lenstab" data-id="pieces">Pieces ${c.items.length}</button><button class="${lensTab==='outfits'?'on':''}" data-act="lenstab" data-id="outfits">Outfits ${outs.length}</button></div>
      ${lensTab==='pieces'
        ?`<div class="grid3">${c.items.map(k=>`<div data-act="toast" data-id="${PC[k][0]}">${img(k)}${PC[k][0]}</div>`).join('')}</div>`
        :(outs.length?outs.map(o=>cardHtml('outfit',o)).join(''):'<p class="cdesc">No full outfits yet. Add a top, bottom and shoes.</p>')}
      <div class="prow"><button class="btn grow" data-act="toast" data-id="Edit capsule">Edit capsule</button></div>`;
    return;
  }
  L.innerHTML=(kind==='outfit'?O:C).map(x=>cardHtml(kind,x)).join('')
    +(kind==='capsule'?`<button class="btn" data-act="toast" data-id="New capsule">+ New capsule</button>`:'');
}

/* ---------- sheets: screens ---------- */
const H={detail:80,swipe:80,piece:74,picker:58,newcap:46};
const sheetName=e=>e.s==='detail'?(e.kind==='outfit'?'Outfit':'Capsule'):e.s==='piece'?'Piece':e.s==='picker'?'Capsules':e.s==='newcap'?'New capsule':'';
const lastPiece=()=>[...stack].reverse().find(s=>s.s==='piece');
function detailBody(kind,id){
  const it=get(kind,id);if(!it)return'';
  const hero=`<div class="hero ${kind==='capsule'?'c2':''}">${it.items.slice(0,kind==='capsule'?4:3).map(img).join('')}</div>`;
  const rows=it.items.map(k=>`<div class="row" data-act="piece" data-id="${k}">${img(k)}<div><b>${PC[k][0]}</b><span>${PC[k][1]||'&nbsp;'}</span></div><i>›</i></div>`).join('');
  const extra=kind==='capsule'?`<div class="lbl">Outfits</div><div class="chips"><span class="chip" data-act="toast" data-id="Shows the outfits">${outfitsIn(it).length} outfits in this capsule ›</span></div>`:'';
  return `${hero}<h3>${it.name}</h3><div class="sub">${kind==='capsule'?it.desc:it.items.length+' pieces'}</div><div class="lbl">Pieces · ${it.items.length}</div>${rows}${extra}`;
}
const detailFoot=kind=>kind==='outfit'
  ?`<button class="btn grow" data-act="toast" data-id="Accessories">+ Accessories</button><button class="btn pri grow" data-act="toast" data-id="Saved to faves">♡ Save</button>`
  :`<button class="btn grow" data-act="toast" data-id="Edit capsule">Edit capsule</button><button class="btn pri grow" data-act="toast" data-id="Add pieces">+ Add pieces</button>`;
function pieceBody(id){
  const caps=capsulesOf(id),outs=O.filter(o=>o.items.includes(id));
  let capUi;
  if(stackOpt==='p4'&&part==='stack'){
    capUi=`<div class="lbl">In capsules</div><div class="chips">${C.map(c=>`<span class="chip ${c.items.includes(id)?'on':''}" data-act="cap" data-id="${c.id}">${c.items.includes(id)?'✓ ':''}${c.name}</span>`).join('')}<span class="chip add" data-act="inlinenew">+ New</span></div>
      ${inlineNew?`<div class="inl"><input id="inlname" placeholder="Capsule name" autocomplete="off"><button class="btn pri" data-act="inlinesave">Add</button></div>`:''}`;
  }else{
    capUi=`<div class="row" data-act="picker"><div><b>Add to capsule</b><span>${caps.length?'In '+caps.map(c=>c.name).join(', '):'Not in any capsule'}</span></div><i>›</i></div>`;
  }
  return `<div class="photo">${img(id)}</div><h3>${PC[id][0]}</h3><div class="sub">${PC[id][1]||'&nbsp;'}</div>${capUi}
    <div class="lbl">Outfits with this piece</div>
    ${outs.map(o=>`<div class="row" data-act="outfitopen" data-id="${o.id}"><div class="minith">${o.items.map(img).join('')}</div><div><b>${o.name}</b></div><i>›</i></div>`).join('')||'<p class="cdesc">None yet</p>'}`;
}
function pickerBody(){
  const p=lastPiece().id;
  return `<p class="sub">${PC[p][0]}</p>`+C.map(c=>`<div class="row" data-act="cap" data-id="${c.id}"><div class="check ${c.items.includes(p)?'on':''}">${c.items.includes(p)?'✓':''}</div><div><b>${c.name}</b><span>${c.items.length} pieces</span></div></div>`).join('')
    +`<div class="row" data-act="newcap"><div><b style="color:#756694">+ New capsule</b></div><i>›</i></div>`;
}
function newcapBody(){const p=lastPiece().id;return `<input class="field" id="ncname" placeholder="Capsule name" autocomplete="off"><p class="sub" style="margin-top:10px">Starts with ${PC[p][0]}.</p>`;}
function screen(i){
  const e=stack[i];
  switch(e.s){
    case'detail':return{title:sheetName(e),body:detailBody(e.kind,e.id),foot:detailFoot(e.kind)};
    case'piece':return{title:'Piece',body:pieceBody(e.id),foot:''};
    case'picker':return{title:'Add to capsule',body:pickerBody(),foot:`<button class="btn pri grow" data-act="back">Done</button>`};
    case'newcap':return{title:'New capsule',body:newcapBody(),foot:`<button class="btn grow" data-act="back">Cancel</button><button class="btn pri grow" data-act="savecap">Save</button>`};
  }
}
function headHtml(i,title){
  const n=stack.length,e=stack[i];let l='',r='';
  if(e.s==='swipe'){
    return `<div class="sh-head"><div><button class="arrow" data-act="prev" aria-label="Previous">‹</button></div><div class="tt"><span class="ctr" id="ctr"></span></div><div class="r"><button class="arrow" data-act="next" aria-label="Next">›</button></div></div>`;
  }
  if(part==='stack'){
    if(stackOpt==='p1'&&i>0)l=`<button class="hb" data-act="back">‹ ${sheetName(stack[i-1])}</button>`;
    else if((stackOpt==='today'||stackOpt==='p3'||stackOpt==='p4')&&i>0)l=`<button class="hb" data-act="back">‹ Back</button>`;
    if(stackOpt==='p2')r=`<button class="hb" data-act="back" aria-label="Close this sheet">✕</button>`;
  }
  let extra='';
  if(part==='stack'&&stackOpt==='p3'&&n>1)extra=`<div class="crumbs">${stack.map((x,j)=>(j?'<span>›</span>':'')+`<button class="${j===i?'cur':''}" data-act="goto" data-id="${j}">${x.s==='piece'?PC[x.id][0].split(' ').slice(0,2).join(' '):sheetName(x)}</button>`).join('')}</div>`;
  if(part==='stack'&&addon&&n>1)extra+=`<div class="allbar"><div class="dots">${stack.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}<span>&nbsp;Step ${i+1} of ${n}</span></div><button class="hb" data-act="closeall">Close all ✕</button></div>`;
  return `<div class="sh-head"><div>${l}</div><div class="tt">${title}</div><div class="r">${r}</div></div>${extra}`;
}
function pageHtml(i){
  const e=stack[i];
  if(e.s==='swipe'){
    const arr=e.kind==='outfit'?O:C;
    return headHtml(i,'')+`<div class="track" id="track">${arr.map(x=>`<div class="slide">${detailBody(e.kind,x.id)}</div>`).join('')}</div><div class="foot">${detailFoot(e.kind)}</div>`;
  }
  const s=screen(i);
  return headHtml(i,s.title)+`<div class="body">${s.body}</div>${s.foot?`<div class="foot">${s.foot}</div>`:''}`;
}
const sheetH=i=>{
  if(part==='open')return 80;
  const s=stack[i].s;
  if(stackOpt==='p1'||stackOpt==='p2')return (stackOpt==='p4'?78:H[s]);
  return 85;
};

/* ---------- sheets: engine ---------- */
function afterPage(root){
  const tr=root.querySelector('#track');
  if(tr){
    const e=stack[stack.length-1],arr=e.kind==='outfit'?O:C,idx=arr.findIndex(x=>x.id===e.id);
    const ctr=root.querySelector('#ctr');
    const upd=()=>{const w=tr.clientWidth||1;ctr.textContent=(Math.round(tr.scrollLeft/w)+1)+' / '+arr.length;};
    requestAnimationFrame(()=>{tr.scrollLeft=idx*tr.clientWidth;upd();});
    tr.addEventListener('scroll',upd);
  }
  const inp=root.querySelector('#ncname,#inlname');
  if(inp&&inp.id==='ncname')setTimeout(()=>inp.focus({preventScroll:true}),320);
}
function sync(dir){
  $('#scrim').classList.toggle('on',stack.length>0);
  if(part==='stack'&&stackOpt==='p2')return syncStack();
  const L=$('#layer'),top=stack[stack.length-1];
  if(!top){
    if(sh){const x=sh;x.classList.remove('in');setTimeout(()=>x.remove(),320);sh=null;}
    return;
  }
  if(!sh){
    sh=document.createElement('div');sh.className='sheet';
    sh.innerHTML='<div class="grip" data-act="grip" aria-label="Close"></div><div class="pgwrap"></div>';
    L.appendChild(sh);
    requestAnimationFrame(()=>requestAnimationFrame(()=>sh&&sh.classList.add('in')));
  }
  sh.style.height=sheetH(stack.length-1)+'%';
  const wrap=sh.querySelector('.pgwrap'),old=wrap.querySelector('.pg');
  const pg=document.createElement('div');
  const anim=stackOpt==='p1'&&part==='stack'&&dir;
  pg.className='pg'+(anim?' from-'+dir:'');pg.innerHTML=pageHtml(stack.length-1);
  wrap.appendChild(pg);
  if(old){if(anim){old.classList.add('to-'+dir);setTimeout(()=>old.remove(),320);}else old.remove();}
  afterPage(pg);
}
function syncStack(){
  const L=$('#layer');
  while(els.length<stack.length){
    const i=els.length,el=document.createElement('div');el.className='sheet';
    el.innerHTML=`<div class="grip" data-act="grip" aria-label="Close"></div><div class="pgin">${pageHtml(i)}</div>`;
    el.style.height=sheetH(i)+'%';L.appendChild(el);els.push(el);afterPage(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
  }
  while(els.length>stack.length){const el=els.pop();el.classList.remove('in');el.style.setProperty('--d',0);setTimeout(()=>el.remove(),320);}
  els.forEach((el,i)=>{el.style.setProperty('--d',els.length-1-i);el.style.zIndex=6+i;});
}
function refresh(){
  if(!stack.length)return;
  if(part==='stack'&&stackOpt==='p2'){
    els.forEach((el,i)=>{const b=el.querySelector('.body'),y=b?b.scrollTop:0;el.querySelector('.pgin').innerHTML=pageHtml(i);const nb=el.querySelector('.body');if(nb)nb.scrollTop=y;});
  }else if(sh){
    const pg=sh.querySelector('.pg'),b=pg.querySelector('.body'),y=b?b.scrollTop:0;
    if(stack[stack.length-1].s==='swipe')return;
    pg.innerHTML=pageHtml(stack.length-1);const nb=pg.querySelector('.body');if(nb)nb.scrollTop=y;
  }
}
function push(e){
  if(part==='stack'&&stackOpt==='p4'&&e.s==='detail'&&stack.length){stack=[e];inlineNew=false;sync(null);return;}
  inlineNew=false;stack.push(e);sync('fwd');
}
function pop(){stack.pop();sync('back');if(stack.length)refresh();}
function closeAllSheets(){stack=[];sync(null);}

/* ---------- events ---------- */
$('#phone').addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case'noop':return;
    case'tab':tab=id;lens=null;expanded=null;menuFor=null;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));renderList();return;
    case'toast':toast(id);return;
    case'card':{
      const kind=t.dataset.kind;
      if(part==='stack'){push({s:'detail',kind,id});return;}
      if(openOpt==='B'){expanded=expanded===id?null:id;menuFor=null;selChip=null;renderList();return;}
      if(openOpt==='C'){stack=[{s:'swipe',kind,id}];sync(null);return;}
      if(openOpt==='D'&&kind==='capsule'){lens=id;lensTab='pieces';renderList();return;}
      stack=[{s:'detail',kind,id}];sync(null);return;
    }
    case'chip':selChip=selChip===id?null:id;renderList();if(selChip)toast(PC[id][0]);return;
    case'menu':menuFor=menuFor===id?null:id;renderList();return;
    case'lensoff':lens=null;renderList();return;
    case'lenstab':lensTab=id;renderList();return;
    case'piece':if(part==='stack')push({s:'piece',id});else toast('Opens the piece sheet');return;
    case'outfitopen':push({s:'detail',kind:'outfit',id});return;
    case'picker':push({s:'picker'});return;
    case'newcap':push({s:'newcap'});return;
    case'back':pop();return;
    case'closeall':closeAllSheets();return;
    case'goto':stack=stack.slice(0,+id+1);sync('back');refresh();return;
    case'scrim':case'grip':
      if(part==='stack'&&stackOpt==='p2')pop();else closeAllSheets();return;
    case'cap':{
      const c=get('capsule',id),p=lastPiece().id,k=c.items.indexOf(p);
      if(k>=0)c.items.splice(k,1);else c.items.push(p);
      refresh();renderList();return;
    }
    case'savecap':case'inlinesave':{
      const inp=$(a==='savecap'?'#ncname':'#inlname'),name=(inp&&inp.value.trim())||'New capsule',p=lastPiece().id;
      C.push({id:'c'+(C.length+1)+Date.now()%1000,name,desc:'',items:[p]});
      if(a==='savecap')pop();else{inlineNew=false;refresh();}
      toast('Created “'+name+'”');renderList();return;
    }
    case'inlinenew':inlineNew=!inlineNew;refresh();{const i=$('#inlname');if(i)i.focus({preventScroll:true});}return;
    case'prev':case'next':{
      const tr=$('#track');if(tr)tr.scrollBy({left:(a==='next'?1:-1)*tr.clientWidth,behavior:'smooth'});return;
    }
  }
});

renderPicker();resetAll();renderSide();
</script>
</body>
</html>
