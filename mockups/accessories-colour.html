<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessories button colour</title>
<style>body{margin:0;padding:16px;background:#E3E0DB;font-family:Figtree,system-ui,sans-serif;color:#121212}
h1{font-size:18px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:#F7F5F1;border-radius:16px;padding:14px}h2{font-size:14px;margin:0 0 10px}code{font-weight:400;color:#6E6E6E;margin-left:6px}
.photo{display:flex;gap:8px;height:130px;margin-bottom:12px}.photo img{flex:1;min-width:0;object-fit:contain}
.row{display:flex;gap:8px;flex-wrap:wrap}.b{font:600 13px Figtree,system-ui,sans-serif;padding:0 16px;min-height:44px;border-radius:999px;border:0;box-shadow:0 1px 2px rgba(18,18,18,.07),0 2px 7px rgba(18,18,18,.07);cursor:pointer}
.shuffle{background:#756694;color:#fff}.dark{background:#121212;color:#E3E0DB}</style></head><body>
<h1>Accessories button colour</h1><div class="grid"><section class="card"><h2>Current grey <code>#D5D2CC</code></h2>

<div class="row"><button class="b" style="background:#D5D2CC;color:#121212" onmouseover="this.style.background='#CAC7C0'" onmouseout="this.style.background='#D5D2CC'">+ Add accessories</button>
<button class="b shuffle">Shuffle</button><button class="b dark">Save</button></div></section><section class="card"><h2>Sage (pick) <code>#C9D3C3</code></h2>

<div class="row"><button class="b" style="background:#C9D3C3;color:#2F3B2D" onmouseover="this.style.background='#BCC8B5'" onmouseout="this.style.background='#C9D3C3'">+ Add accessories</button>
<button class="b shuffle">Shuffle</button><button class="b dark">Save</button></div></section><section class="card"><h2>Dusty clay <code>#E2C9BC</code></h2>

<div class="row"><button class="b" style="background:#E2C9BC;color:#4A2E22" onmouseover="this.style.background='#D6BAAB'" onmouseout="this.style.background='#E2C9BC'">+ Add accessories</button>
