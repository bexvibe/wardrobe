<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filters containers mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--page:#E3E0DB;--surface:#F7F5F1;--line:#D2CFC9;--ink:#121212;--ink-soft:#6E6E6E;--accent-soft:#E7E4DE}
*{box-sizing:border-box}body{margin:0;padding:24px 16px 60px;background:#fff;font:14px 'Figtree',system-ui,sans-serif;color:var(--ink)}
h1{font-size:22px;margin:0 0 4px}.lead{color:var(--ink-soft);margin:0 0 24px;max-width:56ch}
.row{display:flex;flex-wrap:wrap;gap:28px}figure{margin:0;width:300px}figcaption{font-weight:600;margin-bottom:8px}figure p{font-size:12px;color:var(--ink-soft);margin:8px 2px 0}
.phone{height:560px;overflow:hidden;background:var(--page);border-radius:24px;border:1px solid var(--line);padding:8px 14px}
.grab{width:36px;height:4px;border-radius:2px;background:#bbb;margin:0 auto 12px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 14px}.hd b{font-size:20px;font-weight:500}.hd span{font-size:12px}
.l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:9px}
.g{display:flex;flex-wrap:wrap;gap:6px}
.c{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-soft)}
.c.on{border-color:transparent;background:var(--accent-soft);color:var(--ink)}
.s{margin-bottom:12px}
.oa .s{padding:14px;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ob .s{padding:6px 4px;margin-bottom:18px}
.oc .s{padding:14px 4px;margin:0;border-bottom:1px solid var(--line)}.oc .s:last-child{border:0}
.od .body{background:#fff;border-radius:14px;padding:4px 14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.od .s{padding:14px 0;margin:0;border-bottom:1px solid #ECE9E4}.od .s:last-child{border:0}
.oe .s{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.of .s{margin-bottom:16px}.of .l{margin-left:6px}.of .g{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
</style></head><body><h1>Filters: containers</h1><p class="lead">Same sheet, six ways to group the sections. Pick a letter and I'll build it.</p>
<div class="row"><figure><figcaption>A · Now</figcaption><div class="phone oa"><div class="grab"></div><div class="hd"><b>Filters</b><span>Clear all</span></div><div class="body"><div class="s"><div class="l">Capsules</div><div class="g"><span class="c on">Summer</span><span class="c">Sporty</span><span class="c">Winter</span><span class="c">Pregnant</span><span class="c">Lounging</span><span class="c">Boho</span><span class="c">Dressing up</span><span class="c">Minimalist</span></div></div><div class="s"><div class="l">Faves</div><div class="g"><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#F4B6C4" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> Like</span><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#E8607C" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> Love</span><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#B3123F" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> All-time</span></div></div><div class="s"><div class="l">Tags</div><div class="g"><span class="c">summer</span><span class="c">boho</span><span class="c">baggy</span><span class="c">sporty</span><span class="c">dressy</span><span class="c">raining</span></div></div></div></div><p>White card per group with a shadow. Reads as three separate boxes.</p></figure><figure><figcaption>B · Before</figcaption><div class="phone ob"><div class="grab"></div><div class="hd"><b>Filters</b><span>Clear all</span></div><div class="body"><div class="s"><div class="l">Capsules</div><div class="g"><span class="c on">Summer</span><span class="c">Sporty</span><span class="c">Winter</span><span class="c">Pregnant</span><span class="c">Lounging</span><span class="c">Boho</span><span class="c">Dressing up</span><span class="c">Minimalist</span></div></div><div class="s"><div class="l">Faves</div><div class="g"><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#F4B6C4" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> Like</span><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#E8607C" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> Love</span><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#B3123F" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> All-time</span></div></div><div class="s"><div class="l">Tags</div><div class="g"><span class="c">summer</span><span class="c">boho</span><span class="c">baggy</span><span class="c">sporty</span><span class="c">dressy</span><span class="c">raining</span></div></div></div></div><p>No containers. Labels float on the stone background.</p></figure><figure><figcaption>C · Hairline dividers</figcaption><div class="phone oc"><div class="grab"></div><div class="hd"><b>Filters</b><span>Clear all</span></div><div class="body"><div class="s"><div class="l">Capsules</div><div class="g"><span class="c on">Summer</span><span class="c">Sporty</span><span class="c">Winter</span><span class="c">Pregnant</span><span class="c">Lounging</span><span class="c">Boho</span><span class="c">Dressing up</span><span class="c">Minimalist</span></div></div><div class="s"><div class="l">Faves</div><div class="g"><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#F4B6C4" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> Like</span><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#E8607C" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> Love</span><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#B3123F" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> All-time</span></div></div><div class="s"><div class="l">Tags</div><div class="g"><span class="c">summer</span><span class="c">boho</span><span class="c">baggy</span><span class="c">sporty</span><span class="c">dressy</span><span class="c">raining</span></div></div></div></div><p>No boxes. A thin rule between groups gives structure without weight.</p></figure><figure><figcaption>D · One card, groups divided inside</figcaption><div class="phone od"><div class="grab"></div><div class="hd"><b>Filters</b><span>Clear all</span></div><div class="body"><div class="s"><div class="l">Capsules</div><div class="g"><span class="c on">Summer</span><span class="c">Sporty</span><span class="c">Winter</span><span class="c">Pregnant</span><span class="c">Lounging</span><span class="c">Boho</span><span class="c">Dressing up</span><span class="c">Minimalist</span></div></div><div class="s"><div class="l">Faves</div><div class="g"><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#F4B6C4" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> Like</span><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#E8607C" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> Love</span><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#B3123F" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> All-time</span></div></div><div class="s"><div class="l">Tags</div><div class="g"><span class="c">summer</span><span class="c">boho</span><span class="c">baggy</span><span class="c">sporty</span><span class="c">dressy</span><span class="c">raining</span></div></div></div></div><p>A single white container holds everything; groups separated by a hairline. One shape, not three.</p></figure><figure><figcaption>E · Soft tint, no shadow</figcaption><div class="phone oe"><div class="grab"></div><div class="hd"><b>Filters</b><span>Clear all</span></div><div class="body"><div class="s"><div class="l">Capsules</div><div class="g"><span class="c on">Summer</span><span class="c">Sporty</span><span class="c">Winter</span><span class="c">Pregnant</span><span class="c">Lounging</span><span class="c">Boho</span><span class="c">Dressing up</span><span class="c">Minimalist</span></div></div><div class="s"><div class="l">Faves</div><div class="g"><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#F4B6C4" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> Like</span><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#E8607C" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> Love</span><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#B3123F" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> All-time</span></div></div><div class="s"><div class="l">Tags</div><div class="g"><span class="c">summer</span><span class="c">boho</span><span class="c">baggy</span><span class="c">sporty</span><span class="c">dressy</span><span class="c">raining</span></div></div></div></div><p>Groups on a lighter stone tint with a border, like the app's other cards. Quieter than white.</p></figure><figure><figcaption>F · White only behind chips, label outside</figcaption><div class="phone of"><div class="grab"></div><div class="hd"><b>Filters</b><span>Clear all</span></div><div class="body"><div class="s"><div class="l">Capsules</div><div class="g"><span class="c on">Summer</span><span class="c">Sporty</span><span class="c">Winter</span><span class="c">Pregnant</span><span class="c">Lounging</span><span class="c">Boho</span><span class="c">Dressing up</span><span class="c">Minimalist</span></div></div><div class="s"><div class="l">Faves</div><div class="g"><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#F4B6C4" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> Like</span><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#E8607C" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> Love</span><span class="c"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="#B3123F" d="M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2C17 5 19 8.300 17.300 11.800 15 16.400 12 21 12 21z"/></svg> All-time</span></div></div><div class="s"><div class="l">Tags</div><div class="g"><span class="c">summer</span><span class="c">boho</span><span class="c">baggy</span><span class="c">sporty</span><span class="c">dressy</span><span class="c">raining</span></div></div></div></div><p>Label sits on the stone; only the chip area is white. Keeps the grouping, loses the heavy box.</p></figure></div></body></html>
